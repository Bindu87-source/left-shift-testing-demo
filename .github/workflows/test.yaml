
name: Python Unit Tests

on:
  push:
    branches: [LeftShiftTesting]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install coverage unittest-xml-reporting

      - name: Verify test tools
        run: |
          python -m coverage --version
          python -c "import xmlrunner; print('XML runner installed successfully')"

      - name: Run unit tests with coverage and JUnit report
        run: |
          mkdir -p test-reports
          python -m coverage run -m xmlrunner discover -v -o test-reports

      - name: Generate coverage reports
        if: always()
        run: |
          if [ -f .coverage ]; then
            python -m coverage report -m
            python -m coverage xml -o coverage.xml
            python -m coverage html -d htmlcov
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-reports/
            coverage.xml
            htmlcov/
          if-no-files-found: warn
